}

.leading-relaxed{
  line-height: 1.625;
}

.leading-snug{
  line-height: 1.375;
}

.leading-tight{
  line-height: 1.25;
}

.tracking-\[0\.18em\]{
  letter-spacing: 0.18em;
}

  color: var(--muted);
}

  color: rgb(255 255 255 / var(--tw-text-opacity, 1));

}

:root{
  --bg:#FFF6E8;
  --surface:#FFFFFF;
  --surface-2:#FFF0D6;
  --ink:#20291F;
  --muted:#6B7468;
  --line:#E8DCC2;
  --primary:#18794B;
  --primary-2:#0F5A37;
  --accent:#FF7A1A;
  --red:#D93A2B;
  --orange:#E9711B;
  --yellow:#D9A400;
  --green:#18794B;
  --danger-bg:#FFE9E4;
  --warn-bg:#FFF0D6;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#17201A;
    --surface:#22302A;
    --surface-2:#2C3E33;
    --ink:#F4EEDF;
    --muted:#B7C0B5;
    --line:#3D4F44;
    --primary:#5BCB8B;
    --primary-2:#8FE0AE;
    --accent:#FF9A4D;
    --red:#FF6B5E;
    --orange:#FF9A4D;
    --yellow:#FFCE3D;
    --green:#5BCB8B;
    --danger-bg:#4A2623;
    --warn-bg:#4A381F;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,sans-serif
}

.font-display{
  font-family:"Fraunces",Georgia,serif
}

button,input,select,textarea{
  font:inherit
}

input,select,textarea{
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  width:100%
}

input:focus,select:focus,textarea:focus{
  outline:2px solid var(--primary);
  outline-offset:1px
}

.badge{
  font-weight:700;
  font-size:12px;
  line-height:1;
  padding:7px 9px;
  border-radius:999px;
  white-space:nowrap
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 2px 0 rgba(32,41,31,.04)
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:8px 11px;
  font-size:13px;
  font-weight:600;
  cursor:pointer
}

.chip.active{
  background:var(--ink);
  color:var(--bg);
  border-color:var(--ink)
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700;
  border:0;
  cursor:pointer
}

.btn-primary:disabled{
  opacity:.55;
  cursor:not-allowed
}

.btn-ghost{
  background:transparent;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  font-weight:600;
  cursor:pointer;
  color:var(--ink)
}

.btn-danger{
  background:var(--red);
  color:#fff;
  border-radius:12px;
  padding:10px 12px;
  font-weight:700;
  border:0;
  cursor:pointer
}

.tab-btn{
  flex:1;
  padding:12px 6px;
  border-radius:12px;
  font-weight:700;
  font-size:14px;
  border:0;
  cursor:pointer;
  background:transparent;
  color:var(--muted)
}

.tab-btn.active{
  background:var(--primary);
  color:#fff
}

.small{
  font-size:12px;
  color:var(--muted)
}

.hover\:bg-\[var\(--surface-2\)\]:hover{
  background-color: var(--surface-2);
}

@media (min-width: 640px){
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
